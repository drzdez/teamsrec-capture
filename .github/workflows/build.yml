# Tests and the MSI on every push to main and every pull request; a tag v<version> also publishes a GitHub
# Release with the MSI. The tag must match <Version> in dotnet/src/TeamsRec.Capture/TeamsRec.Capture.csproj.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # creating the release on a tag

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test -c Release --logger "console;verbosity=normal"

      - name: Build MSI
        id: msi
        run: |
          $msi = ./installer/build-msi.ps1 | Select-Object -Last 1
          $version = (dotnet msbuild src/TeamsRec.Capture/TeamsRec.Capture.csproj -getProperty:Version).Trim()
          "path=$msi" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: teamsrec-capture-${{ steps.msi.outputs.version }}-msi
          path: ${{ steps.msi.outputs.path }}
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v${{ steps.msi.outputs.version }}") { throw "tag $tag does not match the project version ${{ steps.msi.outputs.version }}" }
          gh release create $tag "${{ steps.msi.outputs.path }}" --title "teamsrec-capture $tag" --generate-notes
